name: Déployer les bots KX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tester les parcours avant déploiement
        run: node --test

      - name: Vérifier les secrets
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          [ -n "$CF" ] || { echo "Secret CLOUDFLARE_API_TOKEN manquant"; exit 1; }
          [ -n "$BOT" ] || { echo "Secret DISCORD_BOT_TOKEN manquant"; exit 1; }

      - name: Nettoyer les jetons (espaces, retours à la ligne, préfixes)
        env:
          RAW_CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          RAW_DISCORD_TOKEN_IA: ${{ secrets.DISCORD_TOKEN_IA }}
          RAW_DISCORD_TOKEN_ACADEMIE: ${{ secrets.DISCORD_TOKEN_ACADEMIE }}
          RAW_DISCORD_TOKEN_MISSIONS: ${{ secrets.DISCORD_TOKEN_MISSIONS }}
          RAW_DISCORD_TOKEN_ARENE: ${{ secrets.DISCORD_TOKEN_ARENE }}
          RAW_DISCORD_TOKEN_VEILLE: ${{ secrets.DISCORD_TOKEN_VEILLE }}
        run: |
          CF=$(printf '%s' "$RAW_CF" | sed 's/^[[:space:]]*Bearer[[:space:]]*//' | tr -d '[:space:]\"')
          echo "::add-mask::$CF"
          case "$CF" in *[!A-Za-z0-9_-]*) echo "Le jeton Cloudflare contient des caractères inattendus"; exit 1;; esac
          echo "CLOUDFLARE_API_TOKEN=$CF" >> "$GITHUB_ENV"
          for NAME in DISCORD_BOT_TOKEN DISCORD_TOKEN_IA DISCORD_TOKEN_ACADEMIE DISCORD_TOKEN_MISSIONS DISCORD_TOKEN_ARENE DISCORD_TOKEN_VEILLE; do
            RAW_VAR="RAW_$NAME"
            T=$(printf '%s' "${!RAW_VAR}" | sed 's/^[[:space:]]*Bot[[:space:]]*//' | tr -d '[:space:]\"')
            if [ -n "$T" ]; then
              echo "::add-mask::$T"
              echo "$NAME présent (longueur ${#T})"
              echo "$NAME=$T" >> "$GITHUB_ENV"
            else
              echo "$NAME absent"
            fi
          done

      - name: Vérifier les accès Discord avant déploiement
        run: node scripts/activate-onboarding.mjs --preflight

      - name: Déployer sur Cloudflare
        run: npx --yes wrangler@4 deploy

      - name: Transmettre les jetons des bots au Worker (chiffrés)
        run: |
          umask 077
          F="$RUNNER_TEMP/secrets.json"
          node -e 'const n=["DISCORD_BOT_TOKEN","DISCORD_TOKEN_IA","DISCORD_TOKEN_ACADEMIE","DISCORD_TOKEN_MISSIONS","DISCORD_TOKEN_ARENE","DISCORD_TOKEN_VEILLE"];const o={};for(const k of n)if(process.env[k])o[k]=process.env[k];require("fs").writeFileSync(process.argv[1],JSON.stringify(o))' "$F"
          npx --yes wrangler@4 secret bulk "$F"
          rm -f "$F"

      - name: Configurer les bots et leurs commandes
        run: node scripts/setup-bots.mjs

      - name: Activer et vérifier l’accueil et les formations
        run: node scripts/activate-onboarding.mjs
