name = "kx-bot"
main = "src/index.js"
account_id = "427aef46cf7f42912bbf17bd3b967e6a"
compatibility_date = "2025-09-01"

# Bannières animées et logos servis par le Worker (dossier public/)
[assets]
directory = "./public"

[ai]
binding = "AI"

[triggers]
crons = ["0 * * * *", "0 7 * * MON", "0 16 * * SUN"]

[vars]
# Identifiants publics de l'application Discord (pas secrets)
DISCORD_APP_ID = "1558510006364545074"
DISCORD_PUBLIC_KEY = "7930d69307ad72e8b0bf3bf95d44fc6a65b534a94ccbecf84a8f258eacff2175"
# Adresse de la CT qui reçoit les demandes /contact (vide = désactivé)
CT_WEBHOOK_URL = ""

[[durable_objects.bindings]]
name = "STORE"
class_name = "KXStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KXStore"]

[observability]
enabled = true
