<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Sans;src:url(fonts/KXAtelierMono-Regular.woff2);font-weight:400}
@font-face{font-family:Sans;src:url(fonts/KXAtelierMono-SemiBold.woff2);font-weight:600}
@font-face{font-family:Titre;src:url(fonts/KXCabaretRozha-Regular.woff2)}
@font-face{font-family:Mot;src:url(fonts/Oxanium.woff2);font-weight:200 800}
:root{--or:#FFD479;--or2:#B78025;--fond:#0b0818}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:480px;overflow:hidden;background:var(--fond)}
.stage{position:relative;width:1200px;height:480px;overflow:hidden;
  background:radial-gradient(520px 380px at 300px 240px,#2a1858 0%,#160e33 45%,transparent 75%),
             radial-gradient(700px 420px at 1000px 120px,#1a1036 0%,transparent 70%),var(--fond);
  font-family:Sans;color:#efeaff}
.grain{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:4px 4px;mix-blend-mode:overlay}
svg.orbits{position:absolute;inset:0}
svg.orbits ellipse{fill:none;stroke:#8f74d6;stroke-opacity:.18;stroke-width:1}
.spark{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;background:var(--or);
  box-shadow:0 0 12px 4px rgba(255,212,121,.65),0 0 40px 10px rgba(255,212,121,.25);
  offset-path:path("M 300 92 A 520 148 0 1 1 299.9 92");offset-rotate:0deg;opacity:0;
  animation:orbit 6s linear infinite, sparkin .6s ease-out 1.4s forwards}
@keyframes orbit{to{offset-distance:100%}}
@keyframes sparkin{to{opacity:1}}

/* badge */
.badge{position:absolute;left:180px;top:120px;width:240px;height:240px}
.halo{position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(circle,rgba(154,107,255,.35),rgba(154,107,255,0) 65%);opacity:0;animation:fade 1.2s ease-out .5s forwards}
.disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1d1440,#0c0920 70%);
  border:1px solid rgba(182,156,255,.25);box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 20px 60px rgba(0,0,0,.5);transform:scale(.6);opacity:0;
  animation:pop .9s cubic-bezier(.2,.9,.2,1.2) .1s forwards}
@keyframes pop{to{transform:scale(1);opacity:1}}
svg.arc{position:absolute;inset:-14px;width:268px;height:268px;transform:rotate(-90deg)}
svg.arc circle{fill:none;stroke:url(#gold);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:0 900;
  animation:draw 1.4s cubic-bezier(.6,0,.2,1) .9s forwards, spin 6s linear infinite;transform-origin:134px 134px}
@keyframes draw{to{stroke-dasharray:210 900}}
@keyframes spin{to{transform:rotate(360deg)}}
svg.logo{position:absolute;left:30px;top:30px;width:180px;height:180px;overflow:visible;animation:breathe 4s ease-in-out 2.2s infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.p{opacity:0;transform-box:fill-box;transform-origin:center}
.p0{animation:in0 1s cubic-bezier(.15,.85,.25,1) .35s forwards}
.p1{animation:in1 1s cubic-bezier(.15,.85,.25,1) .45s forwards}
.p2{animation:in2 1s cubic-bezier(.15,.85,.25,1) .55s forwards}
.p3{animation:in3 1s cubic-bezier(.15,.85,.25,1) .65s forwards}
@keyframes in0{from{opacity:0;transform:translate(-90px,-80px) rotate(-60deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes in1{from{opacity:0;transform:translate(90px,-80px) rotate(60deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes in2{from{opacity:0;transform:translate(-90px,80px) rotate(60deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes in3{from{opacity:0;transform:translate(90px,80px) rotate(-60deg) scale(.6)}to{opacity:1;transform:none}}
.core{opacity:0;animation:fade .5s ease-out 1.15s forwards}
.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ignite 1.6s ease-out 1.2s forwards}
@keyframes ignite{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.35)}100%{opacity:.55;transform:scale(1)}}
@keyframes fade{to{opacity:1}}

/* texte */
.copy{position:absolute;left:520px;top:92px;width:640px}
.label{font-size:15px;letter-spacing:.32em;color:var(--or);font-weight:600;text-transform:uppercase;
  opacity:0;transform:translateY(8px);animation:rise .7s ease-out 1.25s forwards;display:flex;gap:14px;align-items:center}
.label i{display:inline-block;width:34px;height:1px;background:linear-gradient(90deg,var(--or),transparent);transform-origin:left;transform:scaleX(0);animation:line .8s ease-out 1.5s forwards}
@keyframes line{to{transform:scaleX(1)}}
h1{font-family:Titre;font-weight:400;font-size:78px;line-height:1.0;margin-top:16px;letter-spacing:-.01em}
h1 span{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(22px)}
h1 span:nth-child(1){animation:word .9s cubic-bezier(.2,.8,.2,1) 1.55s forwards}
h1 span:nth-child(2){animation:word .9s cubic-bezier(.2,.8,.2,1) 1.75s forwards}
h1 span:nth-child(3){animation:word .9s cubic-bezier(.2,.8,.2,1) 1.95s forwards;
  background:linear-gradient(100deg,#f3eaff 0%,#c9a8ff 45%,#ffd479 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes word{to{opacity:1;filter:blur(0);transform:none}}
p{font-size:20px;line-height:1.5;color:#b9afd6;margin-top:16px;max-width:560px;opacity:0;transform:translateY(10px);animation:rise .8s ease-out 2.45s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.team{display:flex;gap:9px;margin-top:26px}
.team div{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.08em;color:#d8d0f0;padding:7px 12px 7px 9px;border:1px solid rgba(255,255,255,.09);border-radius:999px;background:rgba(255,255,255,.03);
  opacity:0;transform:translateY(8px) scale(.96)}
.team b{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
.team div:nth-child(1){animation:rise .5s ease-out 3.0s forwards}
.team div:nth-child(2){animation:rise .5s ease-out 3.12s forwards}
.team div:nth-child(3){animation:rise .5s ease-out 3.24s forwards}
.team div:nth-child(4){animation:rise .5s ease-out 3.36s forwards}
.team div:nth-child(5){animation:rise .5s ease-out 3.48s forwards}
.team div:nth-child(6){animation:rise .5s ease-out 3.6s forwards}

.tick{position:absolute;width:6px;height:6px;background:var(--or);border-radius:50%;opacity:.0;box-shadow:0 0 8px rgba(255,212,121,.8);animation:fade .6s ease-out 2.2s forwards}
.mark{position:absolute;right:34px;bottom:26px;font-family:Mot;font-weight:700;font-size:20px;letter-spacing:.04em;color:#e9e1ff;opacity:0;animation:fade .8s ease-out 3.6s forwards}
.mark small{display:block;font-family:Sans;font-weight:400;font-size:11px;letter-spacing:.34em;color:#9d90c7;margin-top:2px;text-transform:lowercase}
.sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 1.6s ease-in-out 4.2s forwards}
@keyframes sheen{to{transform:translateX(120%)}}
</style></head>
<body><div class="stage">
  <svg class="orbits" viewBox="0 0 1200 480"><ellipse cx="300" cy="240" rx="520" ry="148"/><ellipse cx="300" cy="240" rx="340" ry="210" transform="rotate(-12 300 240)"/><ellipse cx="300" cy="240" rx="760" ry="260"/></svg>
  <div class="spark"></div>
  <div class="grain"></div>
  <div class="badge">
    <div class="halo"></div>
    <div class="disc"></div>
    <svg class="arc" viewBox="0 0 268 268"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE6A9"/><stop offset=".5" stop-color="#FFD479"/><stop offset="1" stop-color="#B78025" stop-opacity=".2"/></linearGradient></defs><circle cx="134" cy="134" r="126"/></svg>
    <svg class="logo" viewBox="-22 -24 176 176">
      <defs>
        <linearGradient id="pearl" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#ECE6FA"/><stop offset=".72" stop-color="#9A6BFF"/><stop offset="1" stop-color="#D36BFF"/></linearGradient>
        <linearGradient id="violet" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#9A6BFF"/><stop offset="1" stop-color="#D36BFF"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE6A9"/><stop offset=".45" stop-color="#FFD479"/><stop offset="1" stop-color="#B78025"/></linearGradient>
        <radialGradient id="aura"><stop offset=".3" stop-color="#FFD479" stop-opacity=".35"/><stop offset=".6" stop-color="#FFD479" stop-opacity=".12"/><stop offset="1" stop-color="#FFD479" stop-opacity="0"/></radialGradient>
        <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.7"/></filter>
      </defs>
      <path class="p p0" d="M8 9 53 25 58 48 A18 18 0 0 0 49 58 L26 44Z" fill="url(#pearl)"/>
      <path class="p p1" d="M124 9 79 25 74 48 A18 18 0 0 1 83 58 L106 44Z" fill="url(#violet)"/>
      <path class="p p2" d="M8 119 53 103 58 80 A18 18 0 0 1 49 70 L26 84Z" fill="url(#violet)"/>
      <path class="p p3" d="M124 119 79 103 74 80 A18 18 0 0 0 83 70 L106 84Z" fill="url(#pearl)"/>
      <g class="core">
        <circle cx="66" cy="64" r="15" fill="url(#aura)"/>
        <circle class="ring" cx="66" cy="64" r="7.6" fill="none" stroke="#FFD479" stroke-width=".9" filter="url(#soft)"/>
        <circle cx="66" cy="64" r="7.2" fill="#08070D" stroke="url(#g2)" stroke-width=".45"/>
      </g>
    </svg>
  </div>
  <div class="copy">
    <div class="label">K’X Automatisation <i></i> Communauté FDE</div>
    <h1><span>Bienvenue</span> <span>chez</span> <span>K’X.</span></h1>
    <p>On apprend l'automatisation, on construit des agents IA et on livre de vraies missions clients.</p>
    <div class="team">
      <div style="--c:#a78bfa"><b></b>Bot</div>
      <div style="--c:#22d3ee"><b></b>IA</div>
      <div style="--c:#f5b83d"><b></b>Académie</div>
      <div style="--c:#22c55e"><b></b>Missions</div>
      <div style="--c:#f43f5e"><b></b>Arène</div>
      <div style="--c:#ec4899"><b></b>Veille</div>
    </div>
  </div>
  <div class="tick" style="left:22px;top:22px"></div><div class="tick" style="right:22px;top:22px"></div><div class="tick" style="left:22px;bottom:22px"></div>
  <div class="sheen"></div>
</div></body></html>
